[package]
name = "nrps"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Private relay server for NVDA Remote Access"
license = "MIT"
repository = "https://github.com/thyhellcat/nrps"
readme = "README.md"
keywords = ["nvda", "screen-reader", "accessibility", "remote", "relay"]
categories = ["accessibility", "network-programming"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
rcgen = { version = "0.14.10", default-features = false, features = ["pem", "ring"] }
ring = "0.17.14"
serde_json = "1.0.154"
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }

[profile.release]
strip = true
lto = "thin"
